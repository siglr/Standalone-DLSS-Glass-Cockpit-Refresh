# BEGIN Standalone Glass compatibility updates
# Internal rewrites: old apps reject HTTP redirects and use fixed download URLs.
# Clients before 1.0.2 first receive the unchanged three-component transition.
# 1.0.2 then receives an app-only bridge, which understands the official DLL layout.
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteCond %{HTTP_USER_AGENT} ^Standalone-DLSS-Glass-Cockpit-Refresh/(0\.[0-9]+\.[0-9]+|1\.0\.[01])$
    RewriteRule ^Standalone-DLSS-Glass-Cockpit-Refresh\.(version\.json|zip)$ compatibility/Standalone-DLSS-Glass-Cockpit-Refresh-legacy.$1 [END]
    RewriteCond %{HTTP_USER_AGENT} ^Standalone-DLSS-Glass-Cockpit-Refresh/1\.0\.2(?:\.0)?$
    RewriteRule ^Standalone-DLSS-Glass-Cockpit-Refresh\.(version\.json|zip)$ compatibility/Standalone-DLSS-Glass-Cockpit-Refresh-bridge.$1 [END]
</IfModule>
<IfModule mod_headers.c>
    <FilesMatch "^Standalone-DLSS-Glass-Cockpit-Refresh(?:-(?:legacy|bridge))?\.(version\.json|hashes\.json|zip|zip\.sha256)$">
        Header onsuccess unset Cache-Control
        Header always set Cache-Control "no-store"
        Header always merge Vary "User-Agent"
    </FilesMatch>
</IfModule>
# END Standalone Glass compatibility updates
